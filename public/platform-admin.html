<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理平台后台 | 工单系统</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="platform-admin-page">
  <header class="platform-admin-header">
    <div>
      <strong>工单系统</strong>
      <span>管理平台后台</span>
    </div>
    <button id="platform-logout" class="btn gray sm" type="button">退出平台</button>
  </header>

  <div class="platform-admin-shell">
    <nav class="platform-admin-nav" aria-label="管理平台功能">
      <a href="#overview">总览</a>
      <a href="#applications">企业/主管申请</a>
      <a href="#tenants">企业列表与配置</a>
      <a href="#data-center">企业数据中心</a>
      <a href="#audit">平台审计日志</a>
    </nav>

    <main class="platform-admin-content">
      <p id="platform-admin-status" class="platform-form-status" role="status" aria-live="polite"></p>

      <section id="overview" class="platform-section" data-section="overview">
        <div class="platform-section-heading">
          <div><p class="platform-eyebrow">OPERATIONS</p><h1>总览</h1></div>
          <button id="platform-refresh" class="btn gray sm" type="button">刷新数据</button>
        </div>
        <div id="platform-overview-cards" class="platform-overview-grid" aria-live="polite"></div>
      </section>

      <section id="applications" class="platform-section" data-section="applications">
        <div class="platform-section-heading"><div><p class="platform-eyebrow">APPLICATIONS</p><h2>企业/主管申请</h2></div></div>
        <div class="platform-table-wrap">
          <table class="platform-table">
            <thead><tr><th>企业</th><th>主管</th><th>申请时间</th><th>状态</th><th>操作</th></tr></thead>
            <tbody id="platform-applications-body"></tbody>
          </table>
        </div>
      </section>

      <section id="tenants" class="platform-section" data-section="tenants">
        <div class="platform-section-heading"><div><p class="platform-eyebrow">TENANTS</p><h2>企业列表与配置</h2></div></div>
        <div class="platform-table-wrap">
          <table class="platform-table">
            <thead><tr><th>企业名称</th><th>在职人数 / 总人数上限</th><th>状态</th><th>操作</th></tr></thead>
            <tbody id="platform-tenants-body"></tbody>
          </table>
        </div>
      </section>

      <section id="data-center" class="platform-section" data-section="data-center">
        <div class="platform-section-heading">
          <div><p class="platform-eyebrow">DATA CENTER</p><h2>企业数据中心</h2><p class="platform-section-description">按企业查看业务数据；允许修正业务字段，保留审计记录，禁止删除。</p></div>
          <button id="platform-data-refresh" class="btn gray sm" type="button">刷新数据</button>
        </div>
        <div class="platform-data-toolbar">
          <label>企业<select id="platform-data-tenant" aria-label="选择企业"></select></label>
          <label>数据表<select id="platform-data-table" aria-label="选择数据表"></select></label>
          <label class="platform-data-search">搜索<input id="platform-data-search-input" type="search" maxlength="120" placeholder="按关键字搜索"></label>
          <button id="platform-data-search" class="btn sm" type="button">查询</button>
        </div>
        <p id="platform-data-status" class="platform-form-status" role="status" aria-live="polite"></p>
        <div class="platform-table-wrap platform-data-table-wrap">
          <table class="platform-table">
            <thead id="platform-data-head"></thead>
            <tbody id="platform-data-body"></tbody>
          </table>
        </div>
        <div class="platform-data-pagination">
          <button id="platform-data-prev" class="btn gray sm" type="button">上一页</button>
          <span id="platform-data-page">第 1 页</span>
          <button id="platform-data-next" class="btn gray sm" type="button">下一页</button>
        </div>
      </section>

      <section id="audit" class="platform-section" data-section="audit">
        <div class="platform-section-heading"><div><p class="platform-eyebrow">AUDIT</p><h2>平台审计日志</h2></div></div>
        <div class="platform-table-wrap">
          <table class="platform-table">
            <thead><tr><th>时间</th><th>操作者</th><th>动作</th><th>对象</th></tr></thead>
            <tbody id="platform-audit-body"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <template id="tenant-row-template">
    <tr>
      <td><input name="name" type="text" maxlength="80" required></td>
      <td class="platform-staff-limit"><span data-field="activeStaffCount"></span><span>/</span><input name="staffLimit" type="number" min="1" max="999" step="1" required></td>
      <td data-field="status"></td>
      <td><button class="btn sm" data-action="save" type="submit">保存</button><p data-field="message" class="platform-row-message" role="status"></p></td>
    </tr>
  </template>

  <dialog id="approval-dialog" class="platform-dialog">
    <form id="approval-form" method="dialog">
      <h2>批准企业申请</h2>
      <p>请设置企业可用的总人数上限。</p>
      <label>总人数上限
        <input id="approval-staff-limit" name="staffLimit" type="number" value="4" min="1" max="999" step="1" required>
      </label>
      <p id="approval-status" class="platform-form-status" role="status"></p>
      <div class="platform-dialog-actions">
        <button id="approval-cancel" class="btn gray" type="button">取消</button>
        <button id="approval-submit" class="btn" type="submit">确认批准</button>
      </div>
    </form>
  </dialog>

  <dialog id="data-editor-dialog" class="platform-dialog platform-data-editor-dialog">
    <form id="data-editor-form" method="dialog">
      <h2 id="data-editor-title">编辑数据</h2>
      <div id="data-editor-fields" class="platform-data-editor-fields"></div>
      <p id="data-editor-status" class="platform-form-status" role="status"></p>
      <div class="platform-dialog-actions">
        <button id="data-editor-cancel" class="btn gray" type="button">取消</button>
        <button id="data-editor-submit" class="btn" type="submit">保存修改</button>
      </div>
    </form>
  </dialog>

  <script src="js/platform-admin.js"></script>
</body>
</html>
