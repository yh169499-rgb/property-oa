<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>申请企业主管账号 | 工单系统</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="platform-auth-page">
  <main class="platform-auth-card" aria-labelledby="apply-title">
    <a class="platform-back-link" href="/">← 返回企业登录</a>
    <div class="platform-brand">工单系统</div>
    <h1 id="apply-title">申请企业主管账号</h1>
    <p class="platform-auth-lead">提交企业资料后，平台运维人员将进行审核。</p>

    <form id="enterprise-apply-form" class="platform-form">
      <label>企业名称
        <input name="enterpriseName" type="text" maxlength="80" autocomplete="organization" required>
      </label>
      <label>主管姓名
        <input name="supervisorName" type="text" maxlength="40" autocomplete="name" required>
      </label>
      <label>手机号
        <input name="phone" type="tel" inputmode="numeric" maxlength="11" autocomplete="tel" pattern="1[3-9][0-9]{9}" required>
      </label>
      <label>密码
        <input name="password" type="password" minlength="8" autocomplete="new-password" required>
      </label>
      <label>确认密码
        <input name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>
      </label>
      <button id="enterprise-apply-submit" class="btn platform-primary-button" type="submit">提交申请</button>
    </form>
    <p id="enterprise-apply-status" class="platform-form-status" role="status" aria-live="polite"></p>
    <p class="platform-privacy-note">密码仅用于创建主管账号，不会保存在浏览器中。</p>
  </main>
  <script src="js/enterprise-apply.js"></script>
</body>
</html>
