<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理平台登录 | 工单系统</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="platform-auth-page platform-ops-auth">
  <main class="platform-auth-card" aria-labelledby="platform-login-title">
    <div class="platform-brand">工单系统 <span>管理平台</span></div>
    <h1 id="platform-login-title">管理平台登录</h1>
    <p class="platform-auth-lead">使用管理平台账号访问企业审核、配置与数据中心。</p>
    <form id="platform-login-form" class="platform-form">
      <label>手机号
        <input name="phone" type="tel" inputmode="numeric" autocomplete="username" required>
      </label>
      <label>密码
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button id="platform-login-submit" class="btn platform-primary-button" type="submit">登录平台后台</button>
    </form>
    <p id="platform-login-status" class="platform-form-status" role="status" aria-live="polite"></p>
    <a class="platform-back-link platform-back-link-bottom" href="/">返回企业登录</a>
  </main>
  <script src="js/platform-login.js"></script>
</body>
</html>
