services:
  - type: web
    name: property-oa
    runtime: node
    buildCommand: npm install
    startCommand: node index-new.js
    healthCheckPath: /api/staff/status
    # Render 默认文件系统是临时的；数据库必须写入持久化磁盘。
    disk:
      name: property-oa-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: FEISHU_APP_ID
        sync: false
      - key: FEISHU_APP_SECRET
        sync: false
      - key: FEISHU_APP_TOKEN
        value: PdZ0bstWWasvZFsWa3gc5PHznMb
      - key: FEISHU_TABLE_ID
        value: tbloxkuixNZIp76r
      - key: DB_PATH
        value: /var/data/data.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: property-oa-data
      - key: SUPABASE_DB_OBJECT
        value: production/data.db
      - key: SUPABASE_BACKUP_PREFIX
        value: backups
      - key: SUPABASE_SYNC_REQUIRED
        value: "false"
      - key: SEED_WORKFORCE_DEMO
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: AI_REPORT_ENABLED
        value: "false"
      - key: AI_BASE_URL
        value: https://dashscope.aliyuncs.com/compatible-mode/v1
      - key: AI_MODEL
        value: qwen3.6-flash
      - key: AI_TIMEOUT_MS
        value: "30000"
      - key: AI_REPORT_PROMPT_VERSION
        value: report-analysis-v1
      - key: AI_API_KEY
        sync: false
