services:
  - type: web
    name: property-oa
    runtime: node
    buildCommand: npm install
    startCommand: node index-new.js
    healthCheckPath: /api/health
    # Render 默认文件系统是临时的；数据库必须写入持久化磁盘。
    disk:
      name: property-oa-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: FEISHU_APP_ID
        sync: false
      - key: FEISHU_APP_SECRET
        sync: false
      - key: FEISHU_APP_TOKEN
        sync: false
      - key: FEISHU_TABLE_ID
        sync: false
      - key: DB_PATH
        value: /var/data/data.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: property-oa-data
      - key: SUPABASE_DB_OBJECT
        value: production/data.db
      - key: SUPABASE_BACKUP_PREFIX
        value: backups
      - key: SUPABASE_SYNC_REQUIRED
        value: "false"
      # 免费 Render 无 Shell 时可临时开启一次受保护的租户迁移；完成后关闭。
      - key: APPLY_TENANT_MIGRATION_ON_START
        sync: false
      - key: TENANT_MIGRATION_CONFIRM
        sync: false
      - key: TENANT_MIGRATION_SUPERVISOR_PHONE
        sync: false
      - key: TENANT_MIGRATION_TENANT_ID
        sync: false
      - key: TENANT_MIGRATION_TENANT_NAME
        sync: false
      - key: TENANT_MIGRATION_STAFF_LIMIT
        sync: false
      # 平台运维和发财企业只允许受保护的一次性初始化。
      - key: APPLY_PLATFORM_BOOTSTRAP_ON_START
        sync: false
      - key: PLATFORM_BOOTSTRAP_CONFIRM
        sync: false
      - key: SEED_WORKFORCE_DEMO
        value: "false"
      # 平台运维初始化和空白企业凭据只由 Render 安全注入。
      - key: PLATFORM_PROVISIONING_SECRET
        sync: false
      - key: PLATFORM_OWNER_PASSWORD
        sync: false
      - key: BLANK_SUPERVISOR_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://property-oa-fd4y.onrender.com
      - key: AI_REPORT_ENABLED
        value: "false"
      - key: AI_BASE_URL
        value: https://dashscope.aliyuncs.com/compatible-mode/v1
      - key: AI_MODEL
        value: qwen3.6-flash
      - key: AI_TIMEOUT_MS
        value: "30000"
      - key: AI_REPORT_PROMPT_VERSION
        value: report-analysis-v1
      - key: AI_API_KEY
        sync: false
